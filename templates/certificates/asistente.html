<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Certificado de Asistencia</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Arial, sans-serif; background: #f5f1fb; color: #1e1630; width: 1123px; }
      .page { width: 1123px; min-height: 794px; padding: 40px 56px; background: linear-gradient(160deg, #ffffff 0%, #f7efff 100%); }
      .frame { min-height: 714px; border: 3px solid #7a38b8; border-radius: 28px; padding: 36px 44px 32px; display: flex; flex-direction: column; }
      .logos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
      .logo-box { height: 70px; border: 2px dashed rgba(122,56,184,0.35); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: rgba(68,42,103,0.6); font-size: 14px; }
      .eyebrow { text-align: center; font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: #7a38b8; margin-bottom: 8px; }
      .event-title { text-align: center; font-size: 28px; font-weight: 800; line-height: 1.15; color: #1e1630; margin-bottom: 20px; }
      .certifica { text-align: center; font-size: 18px; color: #5c4a73; margin-bottom: 12px; }
      .full-name { text-align: center; font-size: 38px; font-weight: 800; text-transform: uppercase; color: #1e1630; margin-bottom: 8px; line-height: 1.1; }
      .documento { text-align: center; font-size: 15px; color: #5c4a73; margin-bottom: 16px; }
      .body-copy { text-align: center; font-size: 18px; line-height: 1.6; color: #1e1630; max-width: 720px; margin: 0 auto 20px; }
      .event-meta { text-align: center; font-size: 15px; color: #5c4a73; margin-bottom: auto; }
      .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 40px; }
      .signature-box { border-top: 2px solid rgba(30,22,48,0.22); padding-top: 14px; text-align: center; color: #5c4a73; font-size: 13px; }
      .signature-space { height: 60px; margin-bottom: 8px; border: 2px dashed rgba(122,56,184,0.22); border-radius: 12px; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="frame">
        <div class="logos">
          <div class="logo-box">ESPACIO PARA LOGO 1</div>
          <div class="logo-box">ESPACIO PARA LOGO 2</div>
        </div>
        <div class="eyebrow">Certificado de asistencia</div>
        <div class="event-title">{{EVENT_NAME}}</div>
        <div class="certifica">Se certifica que</div>
        <div class="full-name">{{FULL_NAME}}</div>
        <div class="documento">Documento: {{DOCUMENTO}}</div>
        <div class="body-copy">asistio y participo como <strong>asistente</strong> en {{EVENT_NAME}}.</div>
        <div class="event-meta">{{EVENT_DATE}}<br />{{EVENT_LOCATION}}</div>
        <div class="signatures">
          <div class="signature-box"><div class="signature-space"></div>Directivo 1</div>
          <div class="signature-box"><div class="signature-space"></div>Directivo 2</div>
        </div>
      </div>
    </div>
  </body>
</html>
